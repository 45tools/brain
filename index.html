<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF6FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="45 Brain">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<title>45 Brain</title>
<style>
:root{
  /* あそびの配色：ゲームごとに色を変える（タブ・ボタン・選択中のチップ） */
  --bg:#EEF6FF; --dot:#DCE8FA; --panel:#FFFFFF; --ink:#1E2445; --muted:#66708F; --line:#D8E2F2; --soft:#F1F5FC;
  --strong:#1E2445; --strong-ink:#FFFFFF; --danger:#F0435A; --star:#FFB21E; --ok:#1DB765;
  --c-count:#3D7BFF; --c-add:#1DB765; --c-flash:#FF8F1F; --c-hb:#9B5CF6; --c-clock:#FF4F8B;
  --accent:var(--c-count); --accent-ink:#FFFFFF; --field:#3D7BFF;
  --fill:#3D7BFF; --g0:#3D7BFF; --g1:#FF8A3D; --lit:#FFD23F; --S:#FF8F1F; --B:#1DB765;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141A2E; --dot:#1C2440; --panel:#1F2742; --ink:#EEF2FF; --muted:#A5AECB; --line:#333E62; --soft:#27304F; --strong:#EEF2FF; --strong-ink:#141A2E;
    --danger:#FF6177; --star:#FFC23D; --ok:#33D17E;
    --c-count:#5B8FFF; --c-add:#2DC873; --c-flash:#FF9B33; --c-hb:#A979FF; --c-clock:#FF6B9E;
    --fill:#5B8FFF; --g0:#5B8FFF; --g1:#FF9550; --lit:#FFD23F; --S:#FF9B33; --B:#2DC873; color-scheme:dark; }
}
body[data-mode="add"]{--accent:var(--c-add)} body[data-mode="flash"]{--accent:var(--c-flash)}
body[data-mode="hb"]{--accent:var(--c-hb)} body[data-mode="clock"]{--accent:var(--c-clock)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg)}
html,body{margin:0}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 8px) env(safe-area-inset-right) 0 env(safe-area-inset-left);background:var(--bg);color:var(--ink);
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px;background-attachment:fixed;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang TC","PingFang SC",system-ui,sans-serif;overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:inherit}
button,select,label{touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
.num{font-family:"Fredoka","M PLUS Rounded 1c",system-ui,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 0 calc(190px + env(safe-area-inset-bottom))}

.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;max-width:720px;margin:0 auto}
.bar .sp{flex:1;min-width:4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:14px;min-height:44px;padding:0 14px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;color:var(--ink);text-decoration:none}
.btn.icon{width:46px;padding:0;min-height:40px}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.big{min-height:52px;font-size:17px;padding:0 28px}
.btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);flex:none;min-width:0}
.tabs{flex:0 1 auto}
.tabs button{flex:1 1 0;border:0;background:transparent;min-height:46px;min-width:0;width:58px;padding:4px 6px;font-size:11px;font-weight:500;white-space:nowrap;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink)}
.tabs button + button{border-left:1px solid var(--line)}
.tabs .ic{width:20px;height:20px}
.tabs [data-mode="count"]{--tc:var(--c-count)} .tabs [data-mode="add"]{--tc:var(--c-add)} .tabs [data-mode="flash"]{--tc:var(--c-flash)}
.tabs [data-mode="hb"]{--tc:var(--c-hb)} .tabs [data-mode="clock"]{--tc:var(--c-clock)}
.tabs button .ic{color:var(--tc)}
body[data-mode="count"] .tabs [data-mode="count"],body[data-mode="add"] .tabs [data-mode="add"],body[data-mode="flash"] .tabs [data-mode="flash"],
body[data-mode="hb"] .tabs [data-mode="hb"],body[data-mode="clock"] .tabs [data-mode="clock"]{background:var(--tc);color:#fff;font-weight:800}
body[data-mode="count"] .tabs [data-mode="count"] .ic,body[data-mode="add"] .tabs [data-mode="add"] .ic,body[data-mode="flash"] .tabs [data-mode="flash"] .ic,
body[data-mode="hb"] .tabs [data-mode="hb"] .ic,body[data-mode="clock"] .tabs [data-mode="clock"] .ic{color:#fff}

.menu{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 66px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px rgba(10,30,18,.25);padding:6px;display:flex;flex-direction:column;min-width:260px;max-height:calc(100vh - 90px);overflow:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.mi{border:0;background:transparent;text-align:left;min-height:44px;padding:0 14px;font-size:15px;font-weight:500;border-radius:9px;display:flex;align-items:center;gap:10px;white-space:nowrap;color:var(--ink);text-decoration:none}
.mi:active{background:var(--bg)}
.mi .v{margin-left:auto;color:var(--muted);font-size:13px;font-weight:700}
.mi .v.on{color:var(--accent)}
.mi.accent{color:var(--accent);font-weight:700}
.mi select{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 6px;font-size:13px;color:var(--ink)}
.scrim{position:fixed;inset:0;z-index:55}

.panel{margin:10px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 0 var(--line)}
.panel h2{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--accent)}
.lead{margin:0 0 6px;font-size:13px;line-height:1.6;color:var(--muted)}
.lead b{color:var(--ink)}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px}
.ol{font-size:12px;color:var(--muted);min-width:76px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;min-height:38px;padding:0 12px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip input{width:64px;border:0;background:transparent;font:inherit;font-weight:700;color:inherit;text-align:center;padding:0;margin-left:4px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper b{font-size:26px;min-width:76px;text-align:center}
.sw{justify-content:space-between}
.sw input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s;flex:none;margin:0}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{left:23px}
.best{display:flex;align-items:center;gap:8px;font-size:14px}
.best .ic{color:var(--star)}
.best b{font-size:24px}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px;width:100%}
.names input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px;color:var(--ink);min-width:0}

[data-pane]{display:none}
body[data-mode="count"] [data-pane="count"],body[data-mode="add"] [data-pane="add"],body[data-mode="flash"] [data-pane="flash"],
body[data-mode="hb"] [data-pane="hb"],body[data-mode="clock"] [data-pane="clock"]{display:block}
.vw{display:none}
[data-v="setup"]>.vw[data-v="setup"],[data-v="play"]>.vw[data-v="play"]{display:block}
.phead{display:flex;align-items:center;gap:8px;padding:2px 10px 4px}
.phead .sp{flex:1}
.prog{font-size:24px}
.timer{font-size:18px;color:var(--muted);min-width:52px;text-align:right}
.prompt{text-align:center;font-size:16px;padding:2px 10px 8px;min-height:30px}
.sw0{display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:-2px;border:1px solid var(--line)}
.sw0.f{background:var(--fill);border-color:var(--fill)}
.sw0.e{background:var(--panel)}
.banner{text-align:center;padding:10px 12px 0;font-size:15px;line-height:1.5;min-height:46px}
.banner .okc{color:var(--ok);font-weight:700}
.banner .ngc{color:var(--danger);font-weight:700}
.banner small{display:block;color:var(--muted);font-size:12px}
.banner .gold{color:var(--star);font-weight:700}

/* マス */
.cgrid{--gs:max(240px,min(calc(100vw - 24px),calc(100vh - 380px),620px));width:var(--gs);height:var(--gs);margin:0 auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));
  gap:2px;background:var(--line);padding:2px;border-radius:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
@supports (height:100dvh){.cgrid{--gs:max(240px,min(calc(100vw - 24px),calc(100dvh - 380px),620px))}}
.cgrid i{font-style:normal;background:var(--panel);border-radius:2px;display:flex;align-items:center;justify-content:center;position:relative;
  font-family:"Fredoka",sans-serif;font-weight:600;font-size:calc(var(--gs) / var(--n) * .44);color:#fff;line-height:1;overflow:hidden}
.cgrid i.f{background:var(--fill)}
.cgrid.kj i{color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Sans",sans-serif;font-weight:500;font-size:calc(var(--gs) / var(--n) * .64)}
.cgrid.kj i.f{background:var(--panel)}
.cgrid.kj i.mk{background:color-mix(in srgb,var(--g1) 22%,var(--panel))}
.cgrid.kj i.mk::after{display:none}
.cgrid.kj.rev i.t{color:#fff}
.cgrid i em{position:absolute;left:2px;top:1px;font-style:normal;font-family:"Fredoka",sans-serif;font-size:.36em;line-height:1;opacity:.95}
.kchip small{opacity:.5;margin:0 2px}
.kin{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.kin input{width:52px;height:44px;border:1.5px solid var(--line);background:var(--soft);border-radius:12px;text-align:center;font-size:24px;color:var(--ink);padding:0}
.kc{font-size:1.5em;font-weight:500;color:var(--accent);margin:0 2px}
.cgrid i.mk::after{content:"";width:36%;height:36%;border-radius:50%;background:var(--g1)}
.cgrid i.f.mk::after{background:#fff}
.cgrid.rev i.dim{opacity:.28}
.cgrid.rev i.t.g0{background:var(--g0)}
.cgrid.rev i.t.g1{background:var(--g1)}
.cgrid.rev i.t.ten{box-shadow:inset 0 0 0 2px var(--strong)}

/* キーパッド・下のバー */
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 8px calc(12px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
.dockbar{display:flex;flex-direction:column;align-items:stretch;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:0 2px 10px rgba(10,30,18,.14);pointer-events:auto;width:auto;max-width:520px}
.dockbar.wide{width:100%}
.dockbar .row2{display:flex;gap:6px}
.dockbar .row2 .btn{flex:1;min-height:50px;font-size:16px}
.kp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.4fr);gap:5px}
.key{border:1px solid var(--line);background:var(--soft);border-radius:12px;box-shadow:0 3px 0 var(--line);min-height:48px;font-size:24px;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.key:active:not(:disabled){background:var(--soft);transform:translateY(1px)}
.key:disabled{opacity:.3}
.key.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:800;font-family:inherit;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.key .ic{width:24px;height:24px}
.ansrow{display:flex;align-items:center;gap:10px;padding:0 6px}
.ansrow .lbl{font-size:13px;color:var(--muted)}
.ansbox{display:inline-block;min-width:80px;border-bottom:3px solid var(--accent);font-size:30px;text-align:center;line-height:1.1;padding:0 6px}
.ask{text-align:center;font-size:15px;padding:4px 6px}

/* たし算 */
.card{margin:6px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 10px;text-align:center;transition:background .2s}
.card.okf{background:color-mix(in srgb,var(--ok) 18%,var(--panel))}
.card.ngf{background:color-mix(in srgb,var(--danger) 16%,var(--panel))}
.goal{display:flex;align-items:baseline;justify-content:center;gap:10px;font-size:14px;color:var(--muted)}
.goal b{font-size:64px;color:var(--ink);line-height:1}
.eq{display:flex;align-items:center;justify-content:center;gap:6px;font-size:clamp(30px,10.5vw,44px);margin-top:14px;flex-wrap:nowrap;white-space:nowrap}
.eq span{color:var(--muted);font-size:.78em}
.eq .ansbox{min-width:2.4em;font-size:1em}
.fb{min-height:26px;margin-top:10px;font-size:16px;font-weight:700}

/* 瞬間記憶 */
.fhead{display:flex;align-items:center;gap:10px;padding:2px 10px 4px}
.fhead .lv{font-size:24px}
.hearts{display:inline-flex;gap:2px;color:var(--danger)}
.hearts .ic{width:20px;height:20px}
.hearts .ic.lost{color:var(--line)}
.fgrid{--gs:max(240px,min(calc(100vw - 24px),calc(100vh - 330px),560px));width:var(--gs);height:var(--gs);margin:0 auto;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));gap:6px;user-select:none;-webkit-user-select:none}
@supports (height:100dvh){.fgrid{--gs:max(240px,min(calc(100vw - 24px),calc(100dvh - 330px),560px))}}
.fgrid button{border:0;border-radius:10px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);padding:6%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:background .12s,box-shadow .12s}
.fgrid button img{width:100%;height:100%;object-fit:contain;border-radius:3px;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.fgrid button.lit{background:var(--lit);box-shadow:0 0 18px 4px color-mix(in srgb,var(--lit) 70%,transparent)}
.fgrid button.got{background:var(--ok);color:#fff}
.fgrid button.bad{background:var(--danger);color:#fff}
.fgrid button.ans{box-shadow:inset 0 0 0 4px var(--lit)}
.fgrid button .ic{width:50%;height:50%}
.fmsg{text-align:center;font-size:17px;font-weight:700;min-height:30px;padding:2px 10px 8px}
.bonus{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 10px 8px;min-height:58px}
.bonus img{height:50px;border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.bonus .nm{font-size:15px;line-height:1.3}
.bonus .nm b{font-size:18px}

/* 数当て */
.hbcard{margin:6px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center}
.hbcard h3{margin:0 0 6px;font-size:20px}
.hbcard p{margin:4px 0;color:var(--muted);font-size:14px;line-height:1.6}
.digits{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.digits b{width:52px;height:64px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--bg)}
.digits b.on{border-color:var(--accent)}
.hist{margin:8px 10px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;max-height:28vh;overflow:auto}
.hist h4{margin:2px 0 4px;font-size:12px;color:var(--muted);font-weight:500}
.hrow{display:flex;align-items:center;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:15px}
.hrow:first-of-type{border-top:0}
.hrow .n{color:var(--muted);font-size:12px;width:22px}
.hrow .g{font-size:24px;letter-spacing:4px;min-width:72px}
.hrow .r{margin-left:auto;font-weight:700}
.sb{display:inline-flex;align-items:center;gap:3px}
.sb em{font-style:normal;font-weight:800;font-size:12px;width:18px;height:18px;border-radius:5px;color:#fff;display:inline-flex;align-items:center;justify-content:center;margin:0 2px 0 6px}
.sb em.s{background:var(--S)} .sb em.b{background:var(--B)}
.sb i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.sb i.s{background:var(--S);border-color:var(--S)} .sb i.b{background:var(--B);border-color:var(--B)}
.legend{margin:8px 10px 0;font-size:12px;line-height:1.7;color:var(--muted)}
.legend b{font-weight:800} .legend .h{color:var(--S)} .legend .b{color:var(--B)}
.hrow.last{background:var(--soft);border-radius:8px;padding-left:4px}
.memo{margin:8px 10px 0}
.memo h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:500}
.memo .mrow{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.memo button{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-height:40px;font-size:20px;padding:0;position:relative;color:var(--ink)}
.memo button.x{color:var(--muted);text-decoration:line-through;background:var(--soft)}
.memo button.o{border-color:var(--g1);box-shadow:inset 0 0 0 2px var(--g1)}
.hbres{font-size:26px;font-weight:700;text-align:center;min-height:36px;margin-top:6px}
.hbres .h{color:var(--S)} .hbres .b{color:var(--B)}
.secrets{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.secrets span{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;background:var(--bg)}
.secrets b{font-size:22px;margin-left:6px;letter-spacing:2px}

/* 時計 */
.qtext{text-align:center;font-size:17px;padding:4px 10px 6px;min-height:32px}
.clockbox{display:flex;justify-content:center}
.clockbox svg{width:min(78vw,300px);height:min(78vw,300px);touch-action:none;user-select:none;-webkit-user-select:none}
.clockbox svg.drag{cursor:grab}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 10px 0}
.choices .btn{min-height:56px;font-size:20px}
.choices .btn.right{background:var(--ok);border-color:var(--ok);color:#fff}
.choices .btn.wrong{background:var(--danger);border-color:var(--danger);color:#fff}

/* シート */
.overlay{position:fixed;inset:0;background:rgba(10,30,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:80}
.overlay.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 14px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;border:1px solid var(--line)}
.sheet h2{margin:0 0 10px;font-size:18px}
.resbig{text-align:center;margin:4px 0 10px}
.resbig b{font-size:64px;line-height:1;display:block}
.resbig span{font-size:13px;color:var(--muted)}
.resbig .nb{display:inline-block;margin-top:6px;background:var(--star);color:#13241A;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{text-align:center;padding:8px 4px}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:84px 1fr 48px 44px;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.cmp .barbg{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.cmp .barbg i{display:block;height:100%;border-radius:6px}
.cmp .barbg i.a{background:var(--accent)} .cmp .barbg i.b{background:var(--muted)}
.cmp b{font-size:20px;text-align:right}
.cmp small{color:var(--muted);font-size:11px}
.cmph{font-size:12px;color:var(--muted);margin-top:12px}
.note{font-size:13px;line-height:1.6;margin:10px 0 0;color:var(--muted)}
.note.good{color:var(--accent);font-weight:700}
.mlist{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.mlist li{padding:4px 0;border-top:1px solid var(--line)}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}
.help{line-height:1.7;font-size:14px}
.help b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(180px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--strong);color:var(--strong-ink);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:95;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .35s ease-out}
@media (min-width:600px){ .tabs button{width:76px;font-size:12px} }
@media (max-width:360px){ .tabs button{font-size:10px;padding:4px 2px} .bar{gap:4px;padding:8px 6px} #menuBtn{width:40px} }
</style>

let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC.state==="suspended") AC.resume().catch(()=>{}); return AC; }
function tone(f,d,type="sine",v=.15,delay=0){ if(!store.get("b_snd",true)) return; const a=ac(); if(!a) return;
  try{ const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.value=f; const t0=a.currentTime+delay;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+.03); }catch(e){} }
const sfx={ok(){tone(880,.12,"sine",.18);tone(1320,.2,"sine",.15,.09)},ng(){tone(220,.28,"square",.07);tone(165,.3,"square",.06,.1)},tap(){tone(700,.05,"triangle",.07)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,"sine",.15,i*.1))},flash(){tone(1046,.12,"sine",.1)},hit(){tone(988,.1,"triangle",.12)}};
document.addEventListener("pointerdown",()=>ac(),{once:true});
function speak(txt){ if(!store.get("b_tts",true)||!("speechSynthesis" in window)||!txt) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang="en-US"; u.rate=.92;
    const v=speechSynthesis.getVoices().find(v=>(v.lang||"").replace("_","-").startsWith("en-US")); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }

/* 選択チップ */
function chips(el,get,set,onChange){
  const r=()=>$$("[data-val]",el).forEach(b=>b.classList.toggle("on",b.dataset.val===String(get())));
  el.addEventListener("click",e=>{ const b=e.target.closest("[data-val]"); if(!b) return; if(e.target.tagName==="INPUT"&&b.classList.contains("on")) return; set(b.dataset.val); r(); onChange&&onChange(); });
  r(); return r;
}

  const k=d=>`<button class="key num" data-k="${d}"${disabled.has(String(d))?" disabled":""}>${d}</button>`;
  return `<div class="kp">${[1,2,3,4,5].map(k).join("")}<button class="key" data-k="del" aria-label="delete"><i class="ic" data-ic="back"></i></button>${[6,7,8,9,0].map(k).join("")}<button class="key ok" data-k="ok"${okDisabled?" disabled":""}>${esc(okLabel)}</button></div>`; }

  if(b.dataset.k!=null){ m.key&&m.key(b.dataset.k); } else { m.act&&m.act(b.dataset.act); } });

  if(/^[0-9]$/.test(e.key)) m.key(e.key); else if(e.key==="Backspace") m.key("del"); else if(e.key==="Enter") m.key("ok"); else return; e.preventDefault(); });

    if(st.phase==="pass") setDock(`<button class="btn primary big" data-act="ready">${esc(t("ready"))}</button>`);
    else if(st.phase==="secret") setDock(kpHTML(t("decide"),st.input.length<st.D,used),true);
    else if(st.phase==="allset") setDock(`<button class="btn primary big" data-act="begin"><i class="ic" data-ic="play"></i>${esc(t("begin"))}</button>`);
    else if(st.phase==="play") setDock(kpHTML(t("answer"),st.input.length<st.D,used),true);
    else if(st.phase==="result") setDock(`<button class="btn primary big" data-act="pass">${esc(st.P===1?t("next"):t("hbNext",{name:st.pl[(st.cur+1)%st.P].name}))}<i class="ic" data-ic="next"></i></button>`);
    else if(st.phase==="win") setDock(`<div class="row2"><button class="btn" data-act="setup">${esc(t("close"))}</button><button class="btn primary" data-act="again"><i class="ic" data-ic="repeat"></i>${esc(t("retry"))}</button></div>`,true); },
  act(a){ const st=this.st;
    if(a==="start") return this.start();
    if(!st) return;
    if(a==="ready"){ st.phase="secret"; st.input=""; st.show=false; }
    else if(a==="begin"){ st.phase="play"; st.cur=0; st.input=""; }
    else if(a==="pass"){ st.cur=(st.cur+1)%st.P; st.phase="play"; st.input=""; st.res=null; }
    else if(a==="again") return this.start();
    else if(a==="setup") return this.quit();
    this.render(); },
  key(k){ const st=this.st; if(!st||this.pane.dataset.v!=="play"||!(st.phase==="secret"||st.phase==="play")) return;
    if(k==="del"){ st.input=st.input.slice(0,-1); }
    else if(k==="ok"){ if(st.input.length<st.D) return; return st.phase==="secret"?this.setSecret():this.guess(); }
    else { if(st.input.length>=st.D||st.input.includes(k)) return; st.input+=k; }
    sfx.tap(); this.render(); },
  setSecret(){ const st=this.st; st.pl[st.cur].secret=st.input; st.input=""; sfx.ok();
    if(st.cur+1<st.P){ st.cur++; st.phase="pass"; } else { st.phase="allset"; st.cur=0; } this.render(); },
  guess(){ const st=this.st,p=st.pl[st.cur],g=st.input; if(p.hist.some(h=>h.g===g)){ toast(t("hbGuessNo")); return; }
    const sec=st.pl[this.target(st.cur)].secret; let h=0,b=0; for(let i=0;i<g.length;i++){ if(g[i]===sec[i]) h++; else if(sec.includes(g[i])) b++; }
    p.hist.push({g,h,b}); st.input=""; st.res={h,b};
    if(h===st.D){ st.phase="win"; sfx.win(); if(st.P===1){ const bm=store.get("b_hb_best",{}); if(!bm[st.D]||p.hist.length<bm[st.D]){ bm[st.D]=p.hist.length; store.set("b_hb_best",bm); toast(t("newBest")); } } }
    else { (h||b)?sfx.hit():sfx.tap(); st.phase=st.P===1?"play":"result"; if(st.P===1) toast(`${g} → ${h}S ${b}B`); }
    this.render(); },
  memo(i){ const st=this.st; if(!st) return; const p=st.pl[st.cur]; p.memo[i]=(p.memo[i]+1)%3; sfx.tap(); this.render(); },
  quit(){ this.st=null; this.view("setup"); this.refresh(); }
};

function sbHTML(h,b,D){ const dots=(n,c)=>[...Array(D).keys()].map(i=>`<i class="${i<n?c:""}"></i>`).join(""); return `<span class="sb"><em class="s">S</em>${dots(h,"s")}<em class="b">B</em>${dots(b,"b")}</span>`; }

/* =========================================================
   時計
   ========================================================= */
const CLK={
  s:Object.assign({kind:"read",lv:"5",q:"10"},store.get("b_cl",{})),
  st:null,q:null,timer:0,rf:[],
  save(){ store.set("b_cl",this.s); },
  init(){
    this.pane=$('[data-pane="clock"]');
    this.rf.push(chips($("#clKindSel"),()=>this.s.kind,v=>{this.s.kind=v;this.save()},()=>this.refresh()));
    this.rf.push(chips($("#clLvSel"),()=>this.s.lv,v=>{this.s.lv=v;this.save()},()=>this.refresh()));
    this.rf.push(chips($("#clQSel"),()=>this.s.q,v=>{this.s.q=v;this.save()}));
    $("#clQuit").onclick=()=>this.quit();
    this.face(); this.bindDrag();
    $("#clChoices").addEventListener("click",e=>{ const b=e.target.closest("[data-ch]"); if(b) this.choose(+b.dataset.ch,b); });
    this.refresh();
  },
  key0(){ return `${this.s.kind}-${this.s.lv}`; },
  refresh(){ this.rf.forEach(f=>f()); const b=store.get("b_cl_best",{})[this.key0()];
    const kl={read:"kRead",set:"kSet",after:"kAfter",mix:"kMix"}[this.s.kind], ll={60:"lvHour",30:"lvHalf",5:"lvFive",1:"lvOne"}[this.s.lv];
    $("#clBestLbl").textContent=t("bestOf",{k:`${t(kl)}・${t(ll)}`}); $("#clBest").textContent=b??"—"; },
  face(){ const svg=$("#clSvg"); let h=`<circle cx="100" cy="100" r="96" fill="var(--panel)" stroke="var(--strong)" stroke-width="4"/>`;
    for(let i=0;i<60;i++){ const a=i*6*Math.PI/180, r1=i%5?88:83, r2=92; h+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="var(--ink)" stroke-width="${i%5?1:2.4}" stroke-linecap="round"/>`; }
    for(let n=1;n<=12;n++){ const a=n*30*Math.PI/180; h+=`<text x="${100+70*Math.sin(a)}" y="${100-70*Math.cos(a)+6.5}" text-anchor="middle" font-size="19" font-family="Fredoka,sans-serif" font-weight="600" fill="var(--ink)">${n}</text>`; }
    h+=`<line id="hH" x1="100" y1="100" x2="100" y2="52" stroke="var(--g1)" stroke-width="8" stroke-linecap="round"/><line id="hM" x1="100" y1="100" x2="100" y2="24" stroke="var(--g0)" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="var(--strong)"/>`;
    svg.innerHTML=h; },
  hands(total){ total=((total%720)+720)%720; const m=total%60; const am=m*6, ah=total/2;
    const set=(id,a,len)=>{ const r=a*Math.PI/180,l=$(id); l.setAttribute("x2",100+len*Math.sin(r)); l.setAttribute("y2",100-len*Math.cos(r)); };
    set("#hM",am,76); set("#hH",ah,48); },
  bindDrag(){ const svg=$("#clSvg"); let mode0=null,lastM=0;
    const ang=e=>{ const r=svg.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*200-100, y=(e.clientY-r.top)/r.height*200-100; return {a:(Math.atan2(x,-y)*180/Math.PI+360)%360,d:Math.hypot(x,y)}; };
    svg.addEventListener("pointerdown",e=>{ const q=this.q; if(!q||q.kind!=="set"||q.done) return; const p=ang(e);
      const m=q.cur%60, am=m*6, ah=((q.cur%720)/2);
      const diff=(x,y)=>{ const d=Math.abs(x-y)%360; return Math.min(d,360-d); };
      mode0=p.d>60?"m":(diff(p.a,ah)<diff(p.a,am)?"h":"m");
      lastM=m; svg.setPointerCapture(e.pointerId); this.dragMove(p,mode0); e.preventDefault(); });
    svg.addEventListener("pointermove",e=>{ if(!mode0) return; this.dragMove(ang(e),mode0); });
    const end=()=>{ mode0=null; }; svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end); },
  dragMove(p,which){ const q=this.q; if(!q) return; const snap=q.step===1?1:5;
    if(which==="m"){ let m=Math.round(p.a/6/snap)*snap%60; const oldM=q.cur%60; let H=Math.floor(q.cur/60);
      if(oldM>=45&&m<15) H++; else if(oldM<15&&m>=45) H--; q.cur=((H*60+m)%720+720)%720; }
    else { const m=q.cur%60; let H=Math.round((p.a-m/2)/30); q.cur=(((H%12)+12)%12)*60+m; }
    this.hands(q.cur); },
  view(v){ this.pane.dataset.v=v; if(mode==="clock") this.dock(); },
  dock(){ if(mode!=="clock") return; if(this.pane.dataset.v==="setup") return setDock(`<button class="btn primary big" data-act="start"><i class="ic" data-ic="play"></i>${esc(t("start"))}</button>`);
    const q=this.q; if(!q) return setDock("");
    if(q.done){ const last=this.st.i>=this.st.n; return setDock(`<button class="btn primary big" data-act="next">${esc(t(last?"seeResult":"next"))}<i class="ic" data-ic="next"></i></button>`); }
    if(q.kind==="set") return setDock(`<button class="btn primary big" data-act="check"><i class="ic" data-ic="check"></i>${esc(t("answer"))}</button>`);
    setDock(""); },
  act(a){ if(a==="start") this.start(); else if(a==="check") this.checkSet(); else if(a==="next"){ if(this.st.i>=this.st.n) this.finish(); else this.next(); } },
  start(){ this.st={i:0,n:+this.s.q,res:[],score:0}; this.view("play"); this.next();
    clearInterval(this.timer); this.timer=setInterval(()=>{ if(this.q&&!this.q.done) $("#clTime").textContent=fmtSec(now()-this.q.t0); },200); },
  rtime(step){ const h=1+rnd(12); const m=step===60?0:rnd(60/step)*step; return [h,m]; },
  norm(h,m){ let tot=((h%12)*60+m)%720; tot=(tot+720)%720; const H=Math.floor(tot/60)||12; return [H,tot%60]; },
  next(){ const st=this.st,step=+this.s.lv; st.i++;
    const kinds=["read","set","after"]; const kind=this.s.kind==="mix"?kinds[rnd(3)]:this.s.kind;
    const [h,m]=this.rtime(step); const q={kind,h,m,step,t0:now(),done:false}; this.q=q;
    $("#clProg").textContent=`${st.i} / ${st.n}`; $("#clFb").innerHTML=""; $("#clChoices").innerHTML=""; $("#clSvg").classList.toggle("drag",kind==="set");
    if(kind==="read"){ this.hands(h*60+m); $("#clQ").innerHTML=esc(t("clReadQ")); q.ans=[h,m]; this.choices(this.opts(h,m,step)); }
    else if(kind==="set"){ q.ans=[h,m]; let c; do{ const r=this.rtime(step===60?60:5); c=(r[0]%12)*60+r[1]; }while(c===(h%12)*60+m); q.cur=c; this.hands(c);
      $("#clQ").innerHTML=t("clSetQ",{t:esc(fmtHM(h,m))})+`<br><small style="color:var(--muted);font-size:12px">${esc(t("clSetHint"))}</small>`; }
    else { const d=step===60?60*(1+rnd(5)):step===30?30*(1+rnd(5)):step===5?5*(1+rnd(18)):1+rnd(89); q.d=d; this.hands(h*60+m);
      q.ans=this.norm(h,m+d); $("#clQ").innerHTML=t("clAfterQ",{d:esc(fmtDelta(d))}); this.choices(this.opts(q.ans[0],q.ans[1],step===60?60:step===30?30:step===5?5:1,true)); }
    this.dock(); },
  opts(h,m,step,after){ const mp=new Map(); const add=(H,M)=>{ const [a,b]=this.norm(H,M); const k=a*60+b; if(!mp.has(k)) mp.set(k,[a,b]); };
    add(h,m); const st=Math.max(step,5); const cand=[[h+1,m],[h-1,m],[h,m+st],[h,m-st],[h,(60-m)%60],[h+1,m-st]];
    if(m%5===0&&m>0&&!after) cand.push([m/5,(h%12)*5]);
    if(step===60) cand.push([h+2,0],[h-2,0],[h+3,0],[12-h,0]);
    shuffle(cand).forEach(c=>{ if(mp.size<4) add(c[0],c[1]); });
    let guard=0; while(mp.size<4&&guard++<50) add(1+rnd(12),step===60?0:rnd(12)*5);
    return shuffle([...mp.values()]); },
  choices(list){ this.q.list=list; $("#clChoices").innerHTML=list.map(([H,M],i)=>`<button class="btn num" data-ch="${i}">${esc(fmtHM(H,M))}</button>`).join(""); },
  choose(i,b){ const q=this.q; if(!q||q.done||!q.list) return; const [H,M]=q.list[i]; const ok=H===q.ans[0]&&M===q.ans[1];
    $$("#clChoices [data-ch]").forEach((x,j)=>{ const [a,c]=q.list[j]; if(a===q.ans[0]&&c===q.ans[1]) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong"); this.judge(ok); },
  checkSet(){ const q=this.q; if(!q||q.done) return; const tgt=(q.ans[0]%12)*60+q.ans[1]; const ok=q.cur%720===tgt; if(!ok) this.hands(tgt); this.judge(ok); },
  judge(ok){ const q=this.q,st=this.st; q.done=true; q.ms=now()-q.t0; $("#clTime").textContent=fmtSec(q.ms);
    st.res.push({ok,ms:q.ms}); st.score+=ok?100+Math.max(0,Math.round(50*(1-q.ms/12000))):0;
    $("#clFb").innerHTML=ok?`<span class="okc">${esc(t("clOk"))}</span>`:`<span class="ngc">${esc(t("clNg",{t:fmtHM(q.ans[0],q.ans[1])}))}</span>`;
    ok?sfx.ok():sfx.ng(); this.dock(); },
  finish(){ const st=this.st,r=st.res,n=r.length,c=r.filter(x=>x.ok).length,avg=r.reduce((a,x)=>a+x.ms,0)/Math.max(1,n);
    clearInterval(this.timer); const bm=store.get("b_cl_best",{}),k=this.key0(); const isBest=c>0&&st.score>(bm[k]||0); if(isBest){ bm[k]=st.score; store.set("b_cl_best",bm); }
    this.q=null; this.view("setup"); this.refresh();
    showResult({title:t("tClock"),big:pct(c,n)+"%",bigLbl:t("accuracy"),isBest,stats:[[t("correct"),`${c}/${n}`],[t("avgTime"),fmtSec(avg)],[t("score"),st.score]],retry:()=>this.start()}); },
  quit(){ clearInterval(this.timer); this.q=null; this.view("setup"); this.refresh(); }
};

/* =========================================================
   画面の切り替え・メニュー
   ========================================================= */
const MODS={count:CNT,add:ADD,flash:FL,hb:HB,clock:CLK};
let mode="count";
function setMode(m){ if(!MODS[m]) m="count"; mode=m; document.body.dataset.mode=m; store.set("b_mode",m);
  if(location.hash!=="#"+m) history.replaceState(null,"","#"+m); MODS[m].dock(); window.scrollTo(0,0); }
$$(".tabs [data-mode]").forEach(b=>b.addEventListener("click",()=>{ setMode(b.dataset.mode); sfx.tap(); }));
window.addEventListener("hashchange",()=>{ const m=location.hash.slice(1); if(MODS[m]&&m!==mode) setMode(m); });

function openMenu(on){ $("#menu").hidden=!on; $("#scrim").hidden=!on; $("#menuBtn").setAttribute("aria-expanded",on?"true":"false"); }
$("#menuBtn").onclick=()=>openMenu($("#menu").hidden); $("#scrim").onclick=()=>openMenu(false);
function paintToggles(){ const s=store.get("b_snd",true),v=store.get("b_tts",true);
  $("#sndV").textContent=t(s?"on":"off"); $("#sndV").classList.toggle("on",s); $("#ttsV").textContent=t(v?"on":"off"); $("#ttsV").classList.toggle("on",v); }
$("#sndBtn").onclick=()=>{ store.set("b_snd",!store.get("b_snd",true)); paintToggles(); sfx.tap(); };
$("#ttsBtn").onclick=()=>{ const v=!store.get("b_tts",true); store.set("b_tts",v); paintToggles(); if(v) speak("Japan"); };
$("#resetBtn").onclick=()=>{ openMenu(false); if(!confirm(t("resetAsk"))) return; ["b_cnt_best","b_cnt_stats","b_add_best","b_fl_best","b_hb_best","b_cl_best"].forEach(k=>store.del(k)); Object.values(MODS).forEach(m=>m.refresh()); toast(t("resetDone")); };
$("#lang").onchange=e=>{ lang=e.target.value; store.set("b_lang",lang); applyLang(); };
$("#helpBtn").onclick=()=>{ openMenu(false); $("#helpOv").classList.add("on"); };
$("#helpClose").onclick=()=>$("#helpOv").classList.remove("on");
$$(".overlay").forEach(o=>o.addEventListener("click",e=>{ if(e.target===o) o.classList.remove("on"); }));

function applyLang(){ document.documentElement.lang=lang; $$("[data-i]").forEach(el=>el.innerHTML=t(el.dataset.i)); $("#howText").innerHTML=t("how"); $("#lang").value=lang;
  paintToggles(); Object.values(MODS).forEach(m=>m.refresh()); MODS[mode].dock();
  if(HB.st) HB.render(); }

/* ===== 起動 ===== */
$("#supportLink").href=SUPPORT_URL; $("#verLbl").textContent="45tools · ver "+APP_VER;
Object.values(MODS).forEach(m=>m.init());
applyLang();
setMode(MODS[location.hash.slice(1)]?location.hash.slice(1):store.get("b_mode","count"));
if("speechSynthesis" in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
// 新しい版が出たらすぐ使う（プレイ中は勝手に再読み込みしない）
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded) return; if(!$$('[data-pane][data-v="play"]').length){ reloaded=true; location.reload(); } });
}
window.__b={CNT,ADD,FL,HB,CLK,setMode};
